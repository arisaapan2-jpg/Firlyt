<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING F - VERIFICATION</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { border: 1px solid #ffd700; background: #111; display: inline-block; padding: 20px; border-radius: 15px; width: 85%; max-width: 400px; }
        .btn { background: gold; color: black; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin: 10px 0; font-size: 16px; }
        .btn-disabled { background: #333; color: #777; cursor: not-allowed; }
        .key-box { display: none; background: #1a1a1a; padding: 15px; border: 1px dashed #444; color: #0f0; font-weight: bold; font-size: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:gold">KING F VERIFICATION</h2>
        <p id="status">Selesaikan 2 Misi untuk ambil Key!</p>

        <button id="misi1" class="btn" onclick="jalankanMisi(1)">MISI 1 (LINKVERTISE)</button>
        
        <button id="misi2" class="btn btn-disabled" disabled onclick="jalankanMisi(2)">MISI 2 (LINKVERTISE)</button>

        <div id="keyArea" class="key-box">
            KEY: <span id="theKey">KINGF_PREMIUM_881</span>
            <button class="btn" style="margin-top:10px" onclick="copy()">COPY & TAMBAH WAKTU</button>
        </div>
    </div>

    <script>
        let step = 0;

        function jalankanMisi(n) {
            if (n === 1) {
                window.open("https://linkvertise-misi1-kamu.com", "_blank");
                document.getElementById("misi1").innerText = "MISI 1 DONE ✅";
                document.getElementById("misi1").classList.add("btn-disabled");
                document.getElementById("misi2").classList.remove("btn-disabled");
                document.getElementById("misi2").disabled = false;
                document.getElementById("status").innerText = "Satu misi lagi!";
            } else if (n === 2) {
                window.open("https://linkvertise-misi2-kamu.com", "_blank");
                document.getElementById("misi2").innerText = "MISI 2 DONE ✅";
                document.getElementById("misi2").classList.add("btn-disabled");
                document.getElementById("keyArea").style.display = "block";
                document.getElementById("status").innerText = "SEMUA MISI SELESAI!";
            }
        }

        function copy() {
            navigator.clipboard.writeText(document.getElementById('theKey').innerText);
            alert("Key Berhasil Disalin! Silakan Redeem di Executor.");
        }
    </script>
</body>
</html>
