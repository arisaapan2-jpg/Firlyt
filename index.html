<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.id/mulaihari</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: rgba(255, 255, 255, 0.1);
        }
        body, html {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color) url('https://images.unsplash.com/photo-1506126613408-eca07ce68773?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100%; display: flex; align-items: center; justify-content: center;
        }
        /* Overlay biar teks kebaca */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: 0;
        }
        .card {
            position: relative; z-index: 1;
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; padding: 25px;
            width: 85%; max-width: 350px; text-align: center; color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .stiker { width: 100px; height: 100px; margin-bottom: 15px; }
        h2 { font-size: 1.2rem; margin: 10px 0; }
        p { font-size: 0.95rem; opacity: 0.9; line-height: 1.4; }
        .btn-container { display: flex; justify-content: space-around; margin-top: 20px; }
        button {
            padding: 10px 25px; border-radius: 10px; border: none;
            cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .btn-yes { background: #fff; color: #000; }
        .btn-no { background: rgba(255,255,255,0.2); color: #fff; position: relative; }
        #timer { font-weight: bold; color: #ffeb3b; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <img id="imageDisplay" src="https://feeldreams.github.io/pandakuning.gif" class="stiker">
        <h2 id="titleDisplay">Jumat, 24 April 💌</h2>
        <p id="textDisplay">Selamat Hari Mantan Sedunia / Ex Day mantanku tersayanggg, termanisss, terlucuuu, terbaikk seduniaaa 🫣🫵 <br><br><b>BTW, BALIKAN YUKK!</b> 😂</p>
        
        <div class="btn-container" id="btnGroup">
            <button class="btn-yes" onclick="mulaiAksi()">Yukk</button>
            <button class="btn-no" id="btnNo" onmouseover="lari()">Gamau</button>
        </div>
    </div>

    <script>
        function lari() {
            const btn = document.getElementById('btnNo');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        async function mulaiAksi() {
            const title = document.getElementById('titleDisplay');
            const text = document.getElementById('textDisplay');
            const btnGroup = document.getElementById('btnGroup');
            const img = document.getElementById('imageDisplay');

            // 1. Ganti Teks awal
            btnGroup.style.display = 'none';
            title.innerHTML = "Yeaayy Kita Balikan! 🥰❤️";
            img.src = "https://feeldreams.github.io/mikir.gif";
            
            // 2. Hitung Mundur (Countdown)
            let count = 5;
            while (count >= 0) {
                text.innerHTML = `Eitss.. 🏃 Tapi, dalam waktu <span id="timer">${count}</span> detik, Kita PUTUS lagi yaaa~ 😂`;
                await new Promise(r => setTimeout(r, 1000));
                count--;
            }

            // 3. Tapi Boong
            img.src = "https://feeldreams.github.io/ngumpet.gif";
            title.innerHTML = "Tapi Boongg Wkwk! 🤪";
            text.innerHTML = "Mulai hari ini, kita beneran balikan yaa 🥰 <br><br><b>ILY So Much Mantanku, Eh.. Pacarkuu 👀🫵</b>";
        }
    </script>
</body>
</html>
